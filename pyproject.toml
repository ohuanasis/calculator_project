[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "calculator-project"
version = "0.1.0"
description = "A reusable calculator with a command-line interface."
requires-python = ">=3.10"
dependencies = [
    "oracledb>=2,<4",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
calculator = "calculator.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
